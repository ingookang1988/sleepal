<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>SleepPal</title>
<style>
  /* ── 좌표계는 mm ─────────────────────────────────────────────
     SVG viewBox = 화면 실치수(mm)이고 SVG가 화면 전체를 채우므로
     1 유닛 = 1mm 이 된다. 보정할 숫자는 화면 가로 mm 하나뿐이고,
     세로는 CSS 픽셀 종횡비에서 유도한다([PLAN-01b] v0.2). */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:#0A0D14;
    transition:background-color 2.5s ease;
    font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    color:#EAEEF7;-webkit-user-select:none;user-select:none;touch-action:none;
  }
  .screen{position:fixed;inset:0;display:none}
  .screen.on{display:block}

  /* ── 얼굴 ───────────────────────────────────────────────── */
  #faceScreen svg{width:100%;height:100%;display:block}
  .eye{transition:fill 2.5s ease,opacity .5s ease .9s}
  .shut{transition:stroke 2.5s ease,opacity .5s ease .9s}

  /* ── 밝기 대체 — 웹은 시스템 밝기를 못 만진다 ───────────── */
  #dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;
       transition:opacity 2.5s ease}

  /* ── 입장·보정·디버그 — 얼굴과 물리적으로 분리된 화면 (R3) ── */
  #entryScreen,#calScreen,#dbgScreen{display:none;flex-direction:column;
       gap:22px;padding:24px;text-align:center}
  #entryScreen.on,#calScreen.on,#dbgScreen.on{display:flex;align-items:center;justify-content:center}
  h2{font-size:17px;font-weight:600;margin:0;letter-spacing:.01em}
  p{font-size:13px;line-height:1.7;color:#7F8BA3;margin:0;max-width:32em}
  button{font:inherit;font-size:14px;font-weight:600;padding:13px 26px;border-radius:10px;
       border:1px solid #232C3E;background:#131926;color:#EAEEF7;cursor:pointer}
  button.primary{background:#5B8CFF;border-color:#5B8CFF;color:#06090F}
  .rowbtn{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  #ruler{background:#EAEEF7;height:10px;border-radius:2px}
  .dot{width:9px;height:9px;border-radius:99px;background:#4A5468;
       display:inline-block;margin-right:8px;vertical-align:middle;transition:.2s}
  .dot.on{background:#39D98A;box-shadow:0 0 12px #39D98A}
  .dot.err{background:#FF7A45}
  #entryNote{font-size:12px;color:#5D6478}
  #live{display:flex;flex-direction:column;gap:8px;align-items:center}
  #live .big{font-family:ui-monospace,monospace;font-size:34px;font-weight:700;
       font-variant-numeric:tabular-nums;line-height:1;display:flex;
       align-items:baseline;gap:8px}
  #live .unit{font-size:13px;font-weight:400;color:#7F8BA3}
  #live .age{font-size:12px;font-weight:400;color:#7F8BA3;margin-left:10px}
  #live .age.stale{color:#FF7A45;font-weight:700}
  #spark{background:#060910;border:1px solid #232C3E;border-radius:6px;display:block}
  .bars{display:grid;grid-template-columns:170px auto 170px auto;gap:6px 8px;align-items:center}
  .bar{height:9px;background:#131926;border:1px solid #232C3E;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:#5B8CFF;transition:width .08s linear}
  .simrow{align-items:center}
  .lbl{font-family:ui-monospace,monospace;font-size:11px;color:#7F8BA3;min-width:44px}
  #dbgGlare{width:200px;accent-color:#5B8CFF}
  #dbg{font-family:ui-monospace,monospace;font-size:12px;line-height:1.8;
       color:#7F8BA3;white-space:pre;text-align:left}

  /* ── dev HUD — 얼굴 위에 겹치되 *눈 아래 띠*에만 놓는다 ─────
     R3 은 "눈 렌더 영역과 텍스트 영역이 물리적으로 분리"를 요구한다.
     그래서 이 띠의 높이는 CSS 상수가 아니라 매 프레임 눈 바운딩박스
     아래쪽에서 계산된다(paintHud). 눈에 1px 도 닿지 않는다.
     ⛔ NIGHT 에서는 devMode 와 무관하게 강제로 사라진다 (R4).
     기본값 OFF · sessionStorage 라 탭을 닫으면 죽는다 — 무대로 새지 않는다. */
  /* 가로 화면에서 눈 아래 띠는 73mm 중 14mm — 화면 높이의 19% 뿐이다.
     그래서 글자 크기를 띠에 맞춰 줄이고(paintHud), 넘치면 위로 잘라낸다.
     아래로 넘치게 두면 마지막 줄이 화면 밖으로 나가고, 잘라내지 않으면
     눈 영역을 침범한다(R3). 둘 다 막는 조합이 overflow:hidden + 하단 정렬이다. */
  #hud{position:fixed;left:0;right:0;bottom:0;display:none;
       padding:3px 8px;pointer-events:none;overflow:hidden;
       flex-direction:column;justify-content:flex-end;
       font-family:ui-monospace,monospace;font-size:10px;line-height:1.4;
       color:#7F8BA3;white-space:pre;text-align:left;
       background:linear-gradient(to top,rgba(6,9,16,.82),rgba(6,9,16,0));
       text-shadow:0 1px 2px #000}
  #hud.on{display:flex}
  #hud .hi{color:#EAEEF7}
  #hud .warn{color:#FF7A45;font-weight:700}
  #hud .ok{color:#39D98A}
  #hud .hbars{display:flex;gap:6px;align-items:center;margin-top:2px}
  #hud .hbar{height:4px;width:84px;background:#131926;border:1px solid #232C3E;
       border-radius:99px;overflow:hidden}
  #hud .hbar i{display:block;height:100%;width:0;background:#5B8CFF}
  #hud .hbar.now i{background:#39D98A}
</style>
</head>
<body>

<!-- ── 대기 — 얼굴을 빌려주기 전 ─────────────────────────────
     전체화면·회전잠금·Wake Lock 은 전부 사용자 제스처가 있어야
     걸린다. 그래서 이 탭 하나가 반드시 있어야 하고, [WO-01b-3]
     오디오 잠금 해제도 같은 탭 하나로 겸한다. -->
<section id="entryScreen" class="screen on">
  <!-- 목업 1번 화면 — 자면서 기다리는 ∩형 눈. 얼굴 화면이 아니므로 R3 무관 [WO-01b-7] -->
  <svg viewBox="0 0 160 60" style="width:min(52%,240px)" aria-hidden="true">
    <path d="M42 34 q17 -12 34 0" fill="none" stroke="#6E7686" stroke-width="5" stroke-linecap="round"/>
    <path d="M96 34 q17 -12 34 0" fill="none" stroke="#6E7686" stroke-width="5" stroke-linecap="round"/>
  </svg>
  <h2>팰이 기다리고 있어요</h2>
  <p>연결하고 시작하면 눈을 뜹니다.<br>시작하면 가로로 고정되고 화면이 꺼지지 않습니다.</p>
  <div class="rowbtn">
    <button id="bConnect"><span class="dot" id="dot"></span>팰과 연결</button>
    <button class="primary" id="bStart">시작</button>
  </div>
  <p id="entryNote">연결하지 않아도 얼굴은 동작합니다 — 후광만 없습니다.</p>
  <div class="rowbtn">
    <button id="bCal">화면 보정</button>
    <button id="bDev">dev</button>
  </div>
</section>

<!-- ── 얼굴 — 이 안에 문자가 하나도 없어야 한다 (R3) ───────── -->
<section id="faceScreen" class="screen">
  <svg id="face" viewBox="0 0 158 73" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
    <defs>
      <!-- 눈꺼풀 = 마스크. 배경색 사각형이 아니다([ADR-104]) -->
      <!-- 눈꺼풀 아랫변은 직선이 아니라 곡선이다. 직선이면 뜬 눈이 사발처럼
           잘려 기계로 보인다 — 졸림이 이 제품에서 가장 중요한 상태다. -->
      <mask id="mL" maskUnits="userSpaceOnUse" x="-40" y="-40" width="240" height="160">
        <rect x="-40" y="-40" width="240" height="160" fill="#fff"/>
        <path id="lidL" d="M 9 -66 H 69 V -68 Q 39 -62 9 -68 Z" fill="#000"/>
        <!-- 아래꺼풀 [WO-01b-5] — 웃는 눈 ⌣ 은 아래에서 만들어진다. 평소엔 눈 아래에 숨어 있다 -->
        <path id="lidL2" d="M 9 144 H 69 V 66 Q 39 66 9 66 Z" fill="#000"/>
      </mask>
      <mask id="mR" maskUnits="userSpaceOnUse" x="-40" y="-40" width="240" height="160">
        <rect x="-40" y="-40" width="240" height="160" fill="#fff"/>
        <path id="lidR" d="M 89 -66 H 149 V -68 Q 119 -62 89 -68 Z" fill="#000"/>
        <path id="lidR2" d="M 89 144 H 149 V 66 Q 119 66 89 66 Z" fill="#000"/>
      </mask>
      <!-- fx 도상 [WO-01b-5] — 문자 노드가 아니라 도형이다(R3 게이트: <text> 0 유지).
           zzz 는 수면 기호, 음표는 음악 재생 표시. 색·위치는 fx.js 가 매 스폰마다 준다. -->
      <path id="fxZ" d="M 0 0 H 4.2 L 0 4.2 H 4.2" fill="none" stroke-width="1.1"
            stroke-linecap="round" stroke-linejoin="round"/>
      <g id="fxN">
        <ellipse cx="1.1" cy="-1.1" rx="1.6" ry="1.15" transform="rotate(-18 1.1 -1.1)"/>
        <path d="M 2.55 -1.35 V -6.6 Q 4.3 -6.0 4.8 -4.5 Q 3.9 -5.3 2.55 -4.9 Z"/>
      </g>
    </defs>

    <!-- 뜬 눈 — <circle> 이 아니라 <rect rx>. 찡그림을 원으로는 못 만든다.
         rx=12 는 목업(시연 시나리오 v1)의 라운드 사각 눈이다 [WO-01b-7] -->
    <g id="tiltL" transform="rotate(0 39 36.5)">
      <g mask="url(#mL)">
        <rect id="eyeL" class="eye" x="16.5" y="14" width="45" height="45" rx="12" fill="#EAEEF7"/>
      </g>
    </g>
    <g id="tiltR" transform="rotate(0 119 36.5)">
      <g mask="url(#mR)">
        <rect id="eyeR" class="eye" x="96.5" y="14" width="45" height="45" rx="12" fill="#EAEEF7"/>
      </g>
    </g>

    <!-- 감긴 눈 — 곡선 하나. 기하는 목업 SLEEP 화면(폭 38 · 굵기 4 · y 44) -->
    <g id="shutG">
      <path id="shutL" class="shut" d="M 20 44 q 19 10 38 0"
            fill="none" stroke="#6E7686" stroke-width="4" stroke-linecap="round" opacity="0"/>
      <path id="shutR" class="shut" d="M 100 44 q 19 10 38 0"
            fill="none" stroke="#6E7686" stroke-width="4" stroke-linecap="round" opacity="0"/>
    </g>

    <!-- 입 [WO-01b-5] — 곡선(닫힘) + 타원(하품·"후—"). R1: 음소 형태 없음.
         눈보다 얇고(3 vs 5) 옅게 — 감긴 눈 ⌣ 과 헷갈리지 않게. mouth.js 소유. -->
    <g id="mouthG">
      <path id="mouth" d="M 69 63.5 Q 79 66 89 63.5" fill="none"
            stroke="#EAEEF7" stroke-width="3" stroke-linecap="round" opacity="0"/>
      <ellipse id="mouthO" cx="79" cy="65" rx="2.2" ry="0" fill="#EAEEF7" opacity="0"/>
    </g>

    <!-- 떠다니는 도상 [WO-01b-5] — fx.js 가 <use> 를 넣고 뺀다. NIGHT 에서 비어 있다(R4) -->
    <g id="fx"></g>
  </svg>
</section>

<!-- ── 화면 보정 — 재단 원형의 눈금바 100mm 패턴 그대로 ────── -->
<section id="calScreen" class="screen">
  <h2>이 막대가 자로 100mm가 되게 맞추세요</h2>
  <div id="ruler"></div>
  <p>화면 가로 <b id="calVal">158</b> mm</p>
  <div class="rowbtn">
    <button id="calMinus">-1</button><button id="calMinus5">-0.2</button>
    <button id="calPlus5">+0.2</button><button id="calPlus">+1</button>
  </div>
  <div class="rowbtn"><button class="primary" id="calDone">완료</button></div>
</section>

<!-- ── 디버그 — 얼굴을 덮지 않고 대체한다 (R3) ─────────────── -->
<section id="dbgScreen" class="screen">
  <!-- 조도가 살아 있는지 한눈에 보이게 — 숫자만으로는 "빛이 일정한 것"과
       "안 읽고 있는 것"이 구분되지 않는다. age 와 n 이 그걸 가른다. -->
  <div id="live">
    <div class="big"><span id="luxBig">—</span><span class="unit">lux</span>
      <span class="age" id="ageBig">age —</span></div>
    <canvas id="spark" width="300" height="52"></canvas>
    <div class="bars">
      <div class="bar"><i id="barRaw"></i></div><span class="lbl">glare raw</span>
      <div class="bar"><i id="barNow"></i></div><span class="lbl">now</span>
    </div>
  </div>
  <div id="dbg"></div>
  <!-- 폰이 몸통 안에 있을 때의 유일한 조작 경로. [CON-01] RX 메시지만 쓴다. -->
  <div class="rowbtn">
    <button id="dbgConnect">재연결</button>
    <button id="dbgLedOn">LED 최대</button>
    <button id="dbgLedOff">LED 끄기</button>
    <button id="dbgWake">WAKE</button>
  </div>
  <!-- 보드 없이 표정을 보기 위한 조도 대역. 전부 feedLux() 로만 들어가므로
       [CON-01] 규칙 2 는 그대로다 — 상태 전이는 유발하지 않는다. -->
  <div class="rowbtn simrow">
    <span class="lbl">glare</span>
    <input type="range" id="dbgGlare" min="0" max="100" value="0">
    <span class="lbl" id="dbgGlareV">0.00</span>
  </div>
  <div class="rowbtn">
    <button id="dbgLightOn">불 켜기</button>
    <button id="dbgLightOff">불 끄기</button>
    <button id="dbgCam">카메라 조도계</button>
  </div>
  <!-- 얼굴을 보면서 표정 수치를 읽기 위한 것. 디버그 화면은 얼굴을
       *대체*하므로 여기서는 둘을 동시에 볼 수 없다 — 그게 HUD 의 이유다. -->
  <div class="rowbtn">
    <button id="dbgHud">표정 HUD</button>
    <button id="dbgHold">기준선 고정</button>
  </div>
  <!-- 이산 표정·fx 대역 [WO-01b-5] — 전부 [CON-01b] expr:trigger 경로로만 들어간다.
       발화자(babble.js·sound.js)가 없는 동안의 수동 트리거. 누르면 얼굴로 돌아가
       표정이 보인다(봉투가 2초 안에 끝나므로). 상태 전이는 유발하지 않는다. -->
  <div class="rowbtn">
    <button id="dbgHappy">기쁨</button>
    <button id="dbgCurious">호기심</button>
    <button id="dbgSad">서운함</button>
    <button id="dbgNote">♪ 음표</button>
    <button id="dbgMusic">♪ 음악</button>
  </div>
  <!-- 시선 대역 [WO-01b-6] — 합성 소리는 feedSnd() 로만, 마이크는 RMS 만 남기고
       즉시 폐기(오디오는 기기를 떠나지 않는다). 상태 전이는 유발하지 않는다.
       🎙 [ADR-121] 마이크 생애 = 수면 준비 세션 — SLEEP 모드·잠듦·밤에서는
       어떤 경로로 켜졌든 강제 OFF. 이 버튼은 dev 수동 토글(첫 권한 부여 겸). -->
  <div class="rowbtn">
    <button id="dbgSndL">◀ 소리</button>
    <button id="dbgSndC">● 정면</button>
    <button id="dbgSndR">소리 ▶</button>
    <button id="dbgEar">귀 (마이크)</button>
  </div>
  <div class="rowbtn"><button class="primary" id="dbgClose">닫기</button></div>
  <!-- R7 — 카메라는 조도계로만 읽는다. 프레임은 32x24 평균 휘도 하나로
       줄여 즉시 버린다. 저장·전송하지 않고, 인체·자세를 보지 않는다. -->
  <video id="camV" playsinline muted style="display:none"></video>
  <canvas id="camC" width="32" height="24" style="display:none"></canvas>
</section>

<div id="dim"></div>

<!-- dev HUD — #faceScreen *바깥*의 형제다. 안에 두면 얼굴 문자가 0 이 아니게 되어
     face-sheet 의 R3 게이트가 잡는다(실제로 잡혔다). 얼굴 요소에는 문자가
     하나도 없어야 하고, HUD 는 그 위에 겹치는 별개의 층이다.
     띠의 위 경계는 매 프레임 눈 바운딩박스에서 계산된다(paintHud). -->
<div id="hud" aria-hidden="true">
  <div id="hudTxt"></div>
  <div class="hbars">
    <span>raw</span><div class="hbar"><i id="hudRaw"></i></div>
    <span>now</span><div class="hbar now"><i id="hudNow"></i></div>
  </div>
</div>

<script type="module">
// ═══════════════════════════════════════════════════════════════
//  SleepPal — 팰 런타임 부팅 [WO-02a-2]
//  규범 [ARCH-01] · 계약 [CON-01] v0.2 · 도면 [DOM-01] §2
//  R1 — 팰은 말하지 않는다. 음성 출력 경로가 이 코드베이스에 없다.
//  R3 — 눈 영역에 문자가 없다. 디버그는 얼굴을 *대체*한다.
//
//  코드는 파트 소유 단위의 ES 모듈로 갈라져 있다([PLAN-02] §경계 1):
//  H = face/ · ble.js · lux.js / T = mode.js·tracker.js·sound.js(예정) /
//  셸 = core.js · main.js · 이 파일 · sw.js. 여기는 부팅과 BUILD 뿐이다.
// ═══════════════════════════════════════════════════════════════
import { boot } from './main.js';

// 빌드 표시. 손으로 올린다(빌드 단계가 없는 게 이 앱의 전제다).
// ⚠ 이 문자열은 반드시 index.html 에 남는다 — deploy.js 와 배포본 신선도
//   검사가 *이 파일에서* grep 한다([ADR-116]). 모듈로 옮기지 말 것.
const BUILD = '2026-08-22m';

// PWA 서비스워커 — ?v=BUILD 로 등록해 배포마다 SW URL 이 바뀌고, 새 SW 가
// 이전 버전 캐시를 지운다([WO-02a-1]). 등록 실패는 조용히 무시한다 —
// file://·비보안 컨텍스트에서 얼굴은 그대로 떠야 한다.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js?v=' + BUILD).catch(() => {});
}

boot(BUILD);
</script>
</body>
</html>
